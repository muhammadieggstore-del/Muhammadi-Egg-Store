<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhammadi Egg Store</title>
    <script>
      // Automatically intercepts broken image paths at runtime and replaces them with live assets
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'IMG') {
          const src = e.target.src.toLowerCase();
          const alt = (e.target.alt || '').toLowerCase();
          
          if (src.includes('egg') || alt.includes('egg')) {
            e.target.src = 'https://unsplash.com';
          } else if (src.includes('bread') || alt.includes('bread')) {
            e.target.src = 'https://unsplash.com';
          } else if (src.includes('bun') || alt.includes('bun')) {
            e.target.src = 'https://unsplash.com';
          } else {
            // Ultimate backup option if a specific item matching name isn't identified
            e.target.src = 'https://unsplash.com';
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
