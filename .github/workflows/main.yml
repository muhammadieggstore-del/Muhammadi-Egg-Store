name: Deploy Muhammadi Egg Store Live App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Dynamic Build Scan
      run: |
        # Installs base node tools safely if needed, but keeps raw file structures safe
        npm install --legacy-peer-deps || true
        npm run build --if-present || true

    - name: Select Core Web Directory
      id: find-dir
      run: |
        # Pins the precise output folder where index.html sits
        if [ -d "dist" ]; then
          echo "dir=dist" >> $GITHUB_OUTPUT
        elif [ -d "build" ]; then
          echo "dir=build" >> $GITHUB_OUTPUT
        elif [ -d "public" ]; then
          echo "dir=public" >> $GITHUB_OUTPUT
        else
          echo "dir=." >> $GITHUB_OUTPUT
        fi

    - name: Upload Static Web Assets Structure
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ steps.find-dir.outputs.dir }}

    - name: Deploy Live Link to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
