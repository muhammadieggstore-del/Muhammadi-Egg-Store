name: Deploy Muhammadi Egg Store Live App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Configure Asset Paths and Dependencies
      run: |
        # Injects the sub-folder path rules into configuration setups if Vite/React is used
        if [ -f vite.config.js ]; then
          sed -i "s|defineConfig({|defineConfig({ base: '/Muhammadi-Egg-Store/',|g" vite.config.js
        elif [ -f vite.config.ts ]; then
          sed -i "s|defineConfig({|defineConfig({ base: '/Muhammadi-Egg-Store/',|g" vite.config.ts
        fi
        
        npm install --legacy-peer-deps
        npm run build --if-present

    - name: Detect and Stage Public Assets Folder
      id: find-folder
      run: |
        # Verifies if files compiled into dist, build, public, or stay at root folder level
        if [ -d "dist" ]; then
          echo "dir=dist" >> $GITHUB_OUTPUT
        elif [ -d "build" ]; then
          echo "dir=build" >> $GITHUB_OUTPUT
        else
          echo "dir=." >> $GITHUB_OUTPUT
        fi

    - name: Upload Static Web Assets Structure
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ steps.find-folder.outputs.dir }}

    - name: Deploy Live Link to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
