name: Deploy Bun Vite App to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Bun Environment
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Force Generate Public Assets Folder
      run: |
        # Creates physical folders matching standard local asset fallback calls
        mkdir -p public/images
        mkdir -p src/assets
        
        # Downloads professional images directly into the repository workspace
        curl -sL "https://unsplash.com" -o public/white-eggs.jpg
        curl -sL "https://unsplash.com" -o public/bread.jpg
        curl -sL "https://unsplash.com" -o public/bun.jpg
        
        # Duplicates images inside subfolders to catch any route variation AI Studio wrote
        cp public/*.jpg public/images/ 2>/dev/null || true
        cp public/*.jpg src/assets/ 2>/dev/null || true

    - name: Install Dependencies
      run: bun install

    - name: Compile Production Build
      run: bun run build

    - name: Upload Built Static Web Assets
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist

    - name: Deploy Live Link to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
