name: Build Muhammadi Egg Store APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Build Tool
      run: npm install -g @bubblewrap/cli

    - name: Generate Android Project Environment
      run: |
        bubblewrap init --manifest="https://muhammadieggstore.app" --meta-package-name="com.muhammadieggstore.app" --nowelcome --skipconfig || true
        mkdir -p android-output

    - name: Compile Final Production APK
      run: |
        echo "y" | bubblewrap build --skipSigning || true
        # Locate any compiled web APK and move it to a predictable path
        find . -name "*.apk" -exec cp {} android-output/app-debug.apk \; 2>/dev/null || true

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Muhammadi-Egg-Store-APK
        path: android-output/app-debug.apk
