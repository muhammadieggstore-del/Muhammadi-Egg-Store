name: Deploy Bun Vite App to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Bun Environment
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Intercept and Fix Code Image String Links
      run: |
        # Looks for files that contain data and injects live unsplash links directly into the source arrays
        find . -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.json" \) -not -path "*/node_modules/*" -exec sed -i "s|/images/white-eggs.jpg|https://unsplash.com\&auto=format\&fit=crop\&q=80|g" {} +
        find . -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.json" \) -not -path "*/node_modules/*" -exec sed -i "s|/images/bread.jpg|https://unsplash.com\&auto=format\&fit=crop\&q=80|g" {} +
        find . -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.json" \) -not -path "*/node_modules/*" -exec sed -i "s|/images/bun.jpg|https://unsplash.com\&auto=format\&fit=crop\&q=80|g" {} +
        
        # Broad lookup in case files don't start with standard slashes
        find . -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.json" \) -not -path "*/node_modules/*" -exec sed -i "s|images/white-eggs.jpg|https://unsplash.com\&auto=format\&fit=crop\&q=80|g" {} +
        find . -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.json" \) -not -path "*/node_modules/*" -exec sed -i "s|images/bread.jpg|https://unsplash.com\&auto=format\&fit=crop\&q=80|g" {} +
        find . -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.json" \) -not -path "*/node_modules/*" -exec sed -i "s|images/bun.jpg|https://unsplash.com\&auto=format\&fit=crop\&q=80|g" {} +

    - name: Install Dependencies
      run: bun install

    - name: Compile Production Build
      run: bun run build

    - name: Upload Built Static Web Assets
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist

    - name: Deploy Live Link to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
