name: Build Web App to APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies and Build Web Project
      run: |
        npm install --legacy-peer-deps
        npm run build --if-present

    - name: Initialize Android Studio Project Wrapper
      run: |
        npm install @capacitor/core @capacitor/cli --legacy-peer-deps
        npx cap init "Muhammadi Egg Store" "com.muhammadieggstore.app" --web-dir=dist
        npx cap add android
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Muhammadi-Egg-Store-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
