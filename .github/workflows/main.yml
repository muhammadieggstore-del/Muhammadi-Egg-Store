name: Deploy Bun Vite App to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Bun Environment
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install Dependencies
      run: bun install

    - name: Compile Full CSS Styles and App Assets
      run: |
        # Forces Vite to build production-ready optimized stylesheets
        bun run build -- --minify esbuild --force

    - name: Upload Built Static Web Assets
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist

    - name: Deploy Live Link to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
