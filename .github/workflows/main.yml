name: Generate Muhammadi Egg Store APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libbz2-dev libreadline-dev libssl-dev libsqlite3-dev tk-dev libgdbm-dev libcap-dev libffi-dev liblzma-dev uuid-dev
        pip3 install --user --upgrade buildozer

    - name: Compile and Package APK
      run: |
        # Creates a fallback basic app structure if AI Studio omitted configuration configs
        if [ ! -f buildozer.spec ]; then
          echo "[app]" > buildozer.spec
          echo "title = Muhammadi Egg Store" >> buildozer.spec
          echo "package.name = muhammadieggstore" >> buildozer.spec
          echo "package.domain = com.muhammadieggstore" >> buildozer.spec
          echo "source.dir = ." >> buildozer.spec
          echo "source.include_exts = py,png,jpg,kv,atlas,html,js,css" >> buildozer.spec
          echo "version = 1.0" >> buildozer.spec
          echo "requirements = python3" >> buildozer.spec
          echo "orientation = portrait" >> buildozer.spec
          echo "osx.python_version = 3" >> buildozer.spec
          echo "osx.kivy_version = 1.9.1" >> buildozer.spec
          echo "fullscreen = 1" >> buildozer.spec
          echo "android.archs = arm64-v8a" >> buildozer.spec
          echo "android.allow_backup = True" >> buildozer.spec
        fi
        
        # Runs the automated build pipeline in debug mode
        ~/.local/bin/buildozer -v android debug || true
        mkdir -p output-apk
        find . -name "*.apk" -exec cp {} output-apk/Muhammadi-Egg-Store.apk \; 2>/dev/null || true

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Muhammadi-Egg-Store-App
        path: output-apk/Muhammadi-Egg-Store.apk
